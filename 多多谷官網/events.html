</footer><script src="app.js"></script><script>(async function(){
const box=document.getElementById('events-page');
const API_BASE=window.location.hostname.endsWith('github.io')?'https://duoduo-website.onrender.com':'';
function eventTime(value){
  const raw=String(value||'').trim();
  if(!raw)return NaN;
  const m=raw.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[T ]+(\d{1,2})(?::(\d{1,2}))?)?/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0));
    if(Number.isFinite(d.getTime()))return d.getTime();
  }
  const t=Date.parse(raw);
  return Number.isFinite(t)?t:NaN;
}
function eventStatus(e){
  const now=Date.now(),start=eventTime(e.start),end=eventTime(e.end),endIsDateOnly=/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(String(e.end||'').trim());
  const effectiveEnd=endIsDateOnly?end+86400000-1:end;
  if(Number.isFinite(start)&&now<start)return {text:'尚未開始',className:'event-status-upcoming'};
  if(Number.isFinite(effectiveEnd)&&now>effectiveEnd)return {text:'已結束',className:'event-status-ended'};
  return {text:'進行中',className:'event-status-active'};
}
function sortEventList(list){
  return [...list].sort((a,b)=>{
    const at=eventTime(a.start),bt=eventTime(b.start);
    const av=Number.isFinite(at)?at:Number.MIN_SAFE_INTEGER;
    const bv=Number.isFinite(bt)?bt:Number.MIN_SAFE_INTEGER;
    return bv-av;
  });
}
try{
  const res=await fetch(`${API_BASE}/api/events`,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  const es=Array.isArray(data.events)?data.events.map(row=>row?.data||row).filter(e=>e&&e.id&&e.name&&e.published!==false):[];
  const ordered=sortEventList(es);
  const filters=[...document.querySelectorAll('[data-event-filter]')];
  const requestedFilter=new URLSearchParams(location.search).get('ddnav');
  let selectedFilter=['all','active','ended'].includes(requestedFilter)?requestedFilter:'all';
  filters.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.eventFilter===selectedFilter)));
  function renderEvents(){
    const visible=ordered.filter(e=>{
      const status=eventStatus(e);
      return selectedFilter==='all'||(selectedFilter==='active'&&status.className==='event-status-active')||(selectedFilter==='ended'&&status.className==='event-status-ended');
    });
    box.innerHTML=visible.map(e=>{
      const status=eventStatus(e);
      return `<article class="event-page-card"><div class="event-page-media">${eventCarouselHTML(e)}</div><div class="event-page-copy"><div class="event-page-tags"><span class="tag">檔期活動</span><span class="event-status ${status.className}">${status.text}</span></div><h2 title="${esc(e.name||'')}">${esc(e.name||'')}</h2><p title="${esc(e.desc||'')}">${esc(e.desc||'')}</p><div class="event-page-date"><span class="event-page-date-label">活動時間</span><span class="event-page-date-value">${esc(formatEventDateRange(e))}</span></div><a class="text-link" href="event-detail.html?id=${encodeURIComponent(e.id||e.name||'')}">查看詳細說明 →</a></div></article>`;
    }).join('')||`<div class="empty">${selectedFilter==='active'?'目前沒有進行中的活動。':selectedFilter==='ended'?'目前沒有已結束的活動。':'目前沒有公開活動。'}</div>`;
    initEventCarousels(box);
  }
  filters.forEach(button=>button.addEventListener('click',()=>{
    const next=button.dataset.eventFilter;
    if(next===selectedFilter)return;
    selectedFilter=next;
    filters.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    renderEvents();
  }));
  renderEvents();
  // 活動日期跨過開始/結束時間時，更新篩選結果；沒有狀態變動就不重建輪播。
  let previousStatuses=ordered.map(e=>eventStatus(e).className).join('|');
  window.setInterval(()=>{
    const currentStatuses=ordered.map(e=>eventStatus(e).className).join('|');
    if(previousStatuses!==currentStatuses){previousStatuses=currentStatuses;renderEvents();}
  },60000);
}catch(error){
  console.warn('雲端活動讀取失敗：',error);
  box.innerHTML='<div class="empty">目前沒有公開活動。</div>';
}
})();</script>
<!-- DuoDuo public pages: refresh after published cloud content changes -->
<script id="duoduo-public-cloud-refresh">
(() => {
  'use strict';
  const INTERVAL_MS = 60000;
  const API_BASE = location.hostname.endsWith('github.io') ? 'https://duoduo-website.onrender.com' : '';
  const isTools = /\/player-tools\/index\.html$/i.test(location.pathname);
  const page = isTools ? 'player-tools' : (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  const common = isTools ? ['duoduo_settings'] : ['duoduo_settings', 'duoduo_links'];
  const byPage = {
    'index.html': ['duoduo_news', 'duoduo_reviews', 'duoduo_content', 'duoduo_hero',
      'duoduo_layout', 'duoduo_resources', 'duoduo_downloads', 'duoduo_items',
      'duoduo_events', 'duoduo_boss_config'],
    'news.html': ['duoduo_news'],
    'events.html': ['duoduo_events'],
    'event-detail.html': ['duoduo_events'],
    'boss.html': ['duoduo_boss_config'],
    'downloads.html': ['duoduo_downloads', 'duoduo_resources', 'duoduo_items'],
    'guide.html': ['duoduo_resources', 'duoduo_content', 'duoduo_items'],
    'player-tools': ['duoduo_pools', 'duoduo_weekly_prizes']
  };
  const keys = [...new Set([...common, ...(byPage[page] || [])])];
  const snapshots = new Map();
  let checking = false;

  async function checkCloudChanges() {
    if (checking || document.visibilityState === 'hidden' || !navigator.onLine) return;
    checking = true;
    try {
      const response = await fetch(`${API_BASE}/api/site-data`, {
        method: 'GET', headers: { Accept: 'application/json' }, cache: 'no-store'
      });
      if (!response.ok) return;
      const payload = await response.json();
      if (payload?.ok !== true || payload.initialized !== true ||
          !payload.data || typeof payload.data !== 'object') return;
      const data = payload.data;
      for (const key of keys) {
        // A temporarily missing event/BOSS field can mean a failed subquery;
        // do not treat it as a published deletion or trigger a reload loop.
        if (!Object.prototype.hasOwnProperty.call(data, key)) continue;
        const value = JSON.stringify(data[key]);
        if (snapshots.has(key) && snapshots.get(key) !== value) {
          location.reload();
          return;
        }
        snapshots.set(key, value);
      }
    } catch (_) {
      // Failed or offline checks are retried; never refresh on network errors.
    } finally {
      checking = false;
    }
  }

  checkCloudChanges();
  window.setInterval(checkCloudChanges, INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkCloudChanges();
  });
  window.addEventListener('online', checkCloudChanges);
})();
</script>
<!-- DuoDuo public pages: automatic refresh on published HTML changes -->
<script id="duoduo-public-auto-refresh">
(() => {
  'use strict';
  const INTERVAL_MS = 60000;
  const pageUrl = new URL(window.location.pathname, window.location.origin);
  const siteRoot = new URL('./', pageUrl);
  const watchUrls = [...new Set([pageUrl.href, new URL('index.html', siteRoot).href])];
  const known = new Map();
  let checking = false;
  let ready = false;

  async function readPage(url) {
    const requestUrl = new URL(url);
    requestUrl.searchParams.set('_duoduo_check', Date.now().toString());
    const response = await fetch(requestUrl.href, { cache: 'no-store', credentials: 'same-origin' });
    if (!response.ok) throw new Error('Update check failed: ' + response.status);
    return response.text();
  }

  async function check() {
    if (checking || document.visibilityState === 'hidden' || !navigator.onLine) return;
    checking = true;
    try {
      const responses = await Promise.all(watchUrls.map(readPage));
      if (!ready) {
        responses.forEach((html, index) => known.set(watchUrls[index], html));
        ready = true;
        return;
      }
      if (responses.some((html, index) => html !== known.get(watchUrls[index]))) {
        window.location.reload();
      }
    } catch (_) {
      // Network and deployment errors are retried on the next check.
    } finally {
      checking = false;
    }
  }

  check();
  window.setInterval(check, INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') check();
  });
  window.addEventListener('online', check);
})();
</script>
