/* BGM V7 small fix: range sliders are controls, not text inputs.

     interactive, without changing its behavior for other inputs. */

  }

    const json=await response.json();
    if(!json.ok)throw new Error('雲端資料格式錯誤');
    const config=json.data?.duoduo_bgm||{};
    const incoming=(Array.isArray(config.tracks)?config.tracks:[]).filter(t=>t&&t.enabled!==false&&t.id&&t.title&&validUrl(t.url)).map(t=>({id:String(t.id),title:String(t.title),url:validUrl(t.url),cover:validUrl(t.cover||''),accent:/^#[0-9a-fA-F]{6}$/.test(t.accent||'')?t.accent:'#98cef8',caption:String(t.caption||'').slice(0,80)}));
    const fingerprint=JSON.stringify({incoming,defaultId:config.defaultId,mode:config.mode});
    if(!initialLoad&&fingerprint===playlistSnapshot)return;
    playlistSnapshot=fingerprint;playlist=incoming;defaultId=String(config.defaultId||'');
    const adminDefaultMode=config.mode==='shuffle'?'shuffle':config.mode==='single'?'repeat-one':'loop';
    useMode(read(storage.mode,adminDefaultMode),false);
    const active=playlist.find(t=>t.id===selectedId);
    if(!playlist.length){audio.pause();audio.removeAttribute('src');audio.load();selectedId='';play.disabled=true;seek.disabled=true;previous.disabled=true;next.disabled=true;title.textContent='尚未上架 BGM';showArtwork(null);status.textContent='管理員尚未發布任何歌曲。';refreshListUI();refreshPlayback();initialLoad=false;return;}
    const preferred=initialLoad?(playlist.find(t=>t.id===read(storage.track,''))?.id||playlist.find(t=>t.id===defaultId)?.id||playlist[0].id):active?.id||playlist.find(t=>t.id===defaultId)?.id||playlist[0].id;
    const changed=!active||audio.src!==active.url;
    const wasPlaying=!audio.paused;
    refreshListUI();
    if(initialLoad){
      const remembered=readPlaybackPosition(preferred);
      if(remembered){
        pendingResume={...remembered,autoplay:remembered.maintenance?!remembered.paused:read(storage.paused,'0')!=='1'};
        setTrack(preferred,{autoplay:false});
      }else setTrack(preferred,{autoplay:read(storage.paused,'0')!=='1'});
      if(read(storage.paused,'0')==='1'&&!remembered)status.textContent='你上次暫停了 BGM，按播放鍵即可繼續。';
    }
    else if(changed){setTrack(preferred,{autoplay:(wasPlaying||!selectedId)&&read(storage.paused,'0')!=='1'});}
    else{select.value=selectedId;syncTrackPicker();showArtwork(playlist.find(t=>t.id===selectedId));previous.disabled=playlist.length<2;next.disabled=playlist.length<2;}
    initialLoad=false;
  }catch(error){if(initialLoad)status.textContent='暫時無法讀取後台播放清單，請確認雲端服務，稍後可重新整理。';}
  finally{cloudLoading=false;}
}
// Avoid tearing down the audio element: fetch playlist changes in place.
// Load the main site first. BGM cloud initialization remains independent and
// starts shortly after the inner site loads (or at a bounded fallback).
let cloudStarted=false;
function startCloud(){if(cloudStarted)return;cloudStarted=true;fetchCloud();}
frame.addEventListener('load',()=>{
  try{if(frame.contentWindow.location.href!=='about:blank')startCloud();}catch{startCloud();}
});
setTimeout(startCloud,1200);
setInterval(fetchCloud,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchCloud();});
window.addEventListener('online',fetchCloud);
if(!isChecklistEmbed){
// V5 navigation: one persistent audio element, one shareable URL per view.
const pageNames={'home.html':'首頁','index.html':'首頁','news.html':'最新消息','events.html':'檔期活動','event-detail.html':'活動詳情','boss.html':'BOSS 介紹','guide.html':'遊玩指南','downloads.html':'下載專區','privacy.html':'隱私政策','terms.html':'使用條款','player-tools/index.html':'玩家工具','jobs/jobs.html':'角色卡與傳授技能'};
const siteBase=new URL('./',location.href);
const siteRoot=siteBase.pathname;
const ROUTE_PAGES=new Set(['home.html','news.html','events.html','event-detail.html','boss.html','guide.html','downloads.html','privacy.html','terms.html','player-tools/index.html','jobs/jobs.html']);
const ROUTE_KEY='duoduo_v5_route';
let activeFrameDocument=null;

// Cloud data can arrive after the first page has already painted. Do not
// reload the *visible* document: prepare its replacement offscreen, then
// crossfade only when the new document's CSS and header logo are ready.
// The persistent BGM <audio> lives in this outer shell and is never replaced.
let cloudFrameRefreshing=false;
window.duoduoRefreshCloudFrame=function(requestingWindow){
  try{if(sessionStorage.getItem('duoduo_maintenance_admin_preview_v1')==='1' && sessionStorage.getItem('duoduo_admin_session'))return true;}catch(_){}
  if(!frame || requestingWindow!==frame.contentWindow)return false;
  if(cloudFrameRefreshing)return true;
  const current=currentInner();
  if(!current)return false;
  cloudFrameRefreshing=true;
  const oldFrame=frame;
  const candidate=document.createElement('iframe');
  candidate.title=oldFrame.title;
  candidate.allow=oldFrame.allow;
  candidate.referrerPolicy=oldFrame.referrerPolicy;
  candidate.setAttribute('aria-hidden','true');
  candidate.tabIndex=-1;
  candidate.style.cssText='position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:transparent;opacity:0;pointer-events:none;z-index:1;transition:opacity .16s ease';
  let finished=false;
  let poll=null;
  let limit=null;
  function cleanup(){
    if(poll!==null)clearInterval(poll);
    if(limit!==null)clearTimeout(limit);
  }
  function cancel(){
    if(finished)return;
    finished=true;
    cleanup();
    candidate.remove();
    cloudFrameRefreshing=false;
    // The cloud snapshot was saved by app.js even if this attempt failed.
    // Another navigation will use it; never blank the visible homepage.
  }
  async function revealWhenReady(){
    if(finished || frame!==oldFrame)return cancel();
    let doc;
    try{doc=candidate.contentDocument;}catch{return;}
    if(!doc||doc.readyState==='loading')return;
    const destination=safePage(doc.URL);
    const now=currentInner();
    if(!destination||!now||destination.href!==now.href)return;
    const logo=doc.querySelector('header.site-header .brand img');
    const styled=Array.from(doc.styleSheets).some(s=>s.href?.endsWith('/styles.css'));
    if(!logo||!logo.complete||!logo.naturalWidth||!styled)return;
    finished=true;
    cleanup();
    try{if(typeof logo.decode==='function')await logo.decode();}catch(_){}
    // Two animation frames allow the replacement to be rasterized before
    // fading it in; the old page stays fully visible underneath.
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(frame!==oldFrame){candidate.remove();cloudFrameRefreshing=false;return;}
      candidate.style.opacity='1';
      setTimeout(()=>{
        if(frame!==oldFrame){candidate.remove();cloudFrameRefreshing=false;return;}
        oldFrame.removeAttribute('id');
        candidate.id='duoduoSite';
        candidate.removeAttribute('aria-hidden');
        candidate.removeAttribute('tabindex');
        frame=candidate;
        candidate.addEventListener('load',handleInnerLoad);
        oldFrame.remove();
        candidate.removeAttribute('style');
        activeFrameDocument=null;
        wirePage();
        synchronizeFromFrame();
        cloudFrameRefreshing=false;
      },190);
    }));
  }
  oldFrame.insertAdjacentElement('afterend',candidate);
  poll=setInterval(revealWhenReady,60);
  limit=setTimeout(cancel,20000);
  candidate.src=current.href;
  return true;
};

function safePage(raw,base=siteBase){
  try{
    if(!raw||/^\s*(?:javascript:|data:)/i.test(String(raw)))return null;
    const result=new URL(raw,base);
    if(result.origin!==location.origin||!result.pathname.startsWith(siteRoot))return null;
    let relative=result.pathname.slice(siteRoot.length);
    if(!relative||relative==='index.html')relative='home.html';
    if(!ROUTE_PAGES.has(relative))return null;
    return new URL(relative+result.search+result.hash,siteBase);
  }catch{return null;}
}
function routeKey(url){
  const p=url.pathname.slice(siteRoot.length);
  if(p==='home.html'&&!url.search&&!url.hash)return '';
  return p+url.search+url.hash;
}
function outwardUrl(inner){
  const address=new URL('./',siteBase);
  const key=routeKey(inner);
  if(key)address.searchParams.set('page',key);
  return address;
}
function fromLocation(){
  const page=new URLSearchParams(location.search).get('page');
  return safePage(page||'home.html');
}
function currentInner(){
  try{return safePage(frame.contentWindow.location.href);}catch{return null;}
}
function updateAddress(inner,method='push'){
  const destination=outwardUrl(inner);
  if(destination.href===location.href)return;
  const state={...(history.state&&typeof history.state==='object'?history.state:{}),[ROUTE_KEY]:routeKey(inner)};
  if(method==='push')history.pushState(state,'',destination);
  else history.replaceState(state,'',destination);
}
function showCurrentPage(inner){
  const relative=inner.pathname.slice(siteRoot.length);
  byId('pageTitle').textContent=`目前：${pageNames[relative]||'官網頁面'}`;
}
function changeInner(to,method='push'){
  const target=safePage(to);
  if(!target)return false;
  const current=currentInner();
  updateAddress(target,method);
  if(current&&current.href===target.href){
    // Clicking an already-open main heading must return to the page top.
    try{if(target.hash){frame.contentDocument?.getElementById(decodeURIComponent(target.hash.slice(1)))?.scrollIntoView();}else{frame.contentWindow.scrollTo(0,0);}}catch{}
    showCurrentPage(target);return true;
  }
  if(current&&current.pathname===target.pathname&&current.search===target.search){
    // Same page, different anchor: no page or audio reload, no iframe history duplication.
    try{
      const w=frame.contentWindow;
      w.history.replaceState(w.history.state,'',target.href);
      if(target.hash){
        const name=decodeURIComponent(target.hash.slice(1));
        w.document.getElementById(name)?.scrollIntoView();
      }else{w.scrollTo(0,0);}
      w.dispatchEvent(new Event('hashchange'));
      showCurrentPage(target);
      return true;
    }catch{}
  }
  try{frame.contentWindow.location.replace(target.href);}catch{frame.src=target.href;}
  showCurrentPage(target);
  return true;
}
function synchronizeFromFrame(){
  const current=currentInner();
  if(!current)return;
  updateAddress(current,'replace');
  showCurrentPage(current);
}
function wirePage(){
  const doc=frame.contentDocument;
  if(!doc||doc===activeFrameDocument)return;
  activeFrameDocument=doc;
  const win=frame.contentWindow;
  // Keep real links in the original documents (copy-link and new-tab still work).
  // Normal same-tab clicks use the outer router so iframe history is not duplicated.
  doc.addEventListener('click',event=>{
    if(event.defaultPrevented||event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
    const element=event.target?.nodeType===1?event.target:event.target?.parentElement;
    const a=element?.closest?.('a[href]');
    if(!a||a.hasAttribute('download')||a.target==='_blank'||a.target==='_top'||a.target==='_parent')return;
    const url=safePage(a.getAttribute('href'),doc.baseURI);
    if(!url)return;
    event.preventDefault();
    changeInner(url,'push');
  },true);
  // Some pages (e.g. news details) call history.pushState themselves.
  // Their iframe already creates a session-history entry: mirror with replace,
  // not another push, to avoid requiring two Back presses.
  for(const name of ['pushState','replaceState']){
    try{
      const old=win.history[name].bind(win.history);
      win.history[name]=function(...args){
        const result=old(...args);
        synchronizeFromFrame();
        return result;
      };
    }catch{}
  }
  win.addEventListener('popstate',synchronizeFromFrame);
  win.addEventListener('hashchange',synchronizeFromFrame);
}
function handleInnerLoad(){
  const inner=currentInner();
  if(!inner)return;
  wirePage();
  synchronizeFromFrame();
  // First visit only: show the completed inner document, not the intermediate blank iframe.
  // Keep the iframe and persistent BGM routing exactly as before.
  if(!document.documentElement.classList.contains('duoduo-site-ready')){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.documentElement.classList.add('duoduo-site-ready');
    }));
  }
}
frame.addEventListener('load',handleInnerLoad);
window.addEventListener('popstate',()=>{
  const want=fromLocation();
  if(!want)return;
  const have=currentInner();
  if(!have||have.href!==want.href)changeInner(want,'replace');
  else showCurrentPage(want);
});
// Don't load the old homepage before the requested shareable subpage.
const firstPage=fromLocation()||safePage('home.html');
frame.src=firstPage.href;
showCurrentPage(firstPage);

// Reveal the first real page as soon as its CSS, document and header logo are ready.
// Do not hold the whole page hostage to below-the-fold hero/media downloads.
let firstRevealStarted=false;
const firstPaintPoll=setInterval(()=>{
  if(document.documentElement.classList.contains('duoduo-site-ready')){
    clearInterval(firstPaintPoll);
    return;
  }
  if(firstRevealStarted)return;
  let doc;
  try{doc=frame.contentDocument;}catch{return;}
  if(!doc||doc.readyState==='loading'||!safePage(doc.URL))return;
  const headerLogo=doc.querySelector('header.site-header .brand img');
  if(!headerLogo||!headerLogo.complete||!headerLogo.naturalWidth)return;
  // An available stylesheet object means the site's shared CSS finished loading.
  const styled=Array.from(doc.styleSheets).some(sheet=>sheet.href?.endsWith('/styles.css'));
  if(!styled)return;
  firstRevealStarted=true;
  clearInterval(firstPaintPoll);
  Promise.resolve(typeof headerLogo.decode==='function'?headerLogo.decode():null)
    .catch(()=>{}).then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.documentElement.classList.add('duoduo-site-ready');
    })));
},50);
// Failsafe: don't leave a polling timer running when the frame is blocked.
setTimeout(()=>clearInterval(firstPaintPoll),15000);

} // end official-site-only routing (Checklist embeds only the player)
// Do not compare a partially parsed live document with fetched complete HTML.
// The shared byte-verified update monitor is the single reload authority.
window.duoduoPrepareForUpdate=()=>{try{storePlaybackPosition()}catch(_){}};



})();
</script>
