<style>
:root { color-scheme:dark; --panel:#101d2d; --line:rgba(175,205,245,.22); --text:#f5f7ff; --muted:#a8b7cc; --accent:#82c9ff; }

#fileLabel:hover {background:rgba(125,176,249,.17);}

#mini svg {width:24px;height:24px;}

#label {font-size:10px; color:#94c8fc; margin-left:4px;font-weight:500;}
@media(max-width:480px){#player{right:10px;bottom:max(10px,env(safe-area-inset-bottom));width:min(355px,calc(100vw - 20px));padding:12px;}#mini{right:12px;bottom:max(12px,env(safe-area-inset-bottom));}}

#playlistArea { min-width:0; flex:1; display:grid; gap:4px; }
#playlistLabel {font-size:10px;color:var(--muted);}
#trackList {font:inherit;font-size:12px;color:var(--text);background:#17283e;border:1px solid var(--line);border-radius:8px;padding:8px 7px;width:100%;min-width:0;max-width:100%;}
#trackList option {background:#102137;color:white;}

#modeCycle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

#skipButtons .iconButton:disabled {opacity:.35;cursor:not-allowed;}
#volumeBox {min-width:72px!important;max-width:90px!important;}
@media(max-width:480px){#bottomline{gap:8px;}#volumeBox{display:none!important;}#skipButtons .iconButton{width:34px;height:34px;}#hint{display:none;}#modeExplanation{display:none;}#modeCycle{min-height:34px;} }

/* BGM V7: group transport controls together, keep the track picker on its own row. */
#modeRow { gap:8px; justify-content:flex-start; min-width:0; }
#modeCycle { flex:0 0 auto; white-space:nowrap; }
#skipButtons { flex:0 0 auto; gap:6px; }
#volumeBox { margin-left:auto; flex:0 1 92px; min-width:0!important; max-width:92px!important; }
#bottomline { margin-top:12px; }
#playlistArea { width:100%; }
.visuallyHidden { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
@media (max-width:480px) {
  #modeRow { gap:6px; }
  #skipButtons { margin-left:auto; gap:7px; }
  #modeCycle { padding:5px 8px; }
}

<div id="player" role="region" aria-label="多多谷常駐背景音樂播放器">
  <div id="topline">
    <div id="musicCircle" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg></div>
    <div id="headTitles"><strong>DuoDuo BGM <span id="label">雲端播放清單</span></strong><small id="pageTitle">目前：首頁</small></div>
    <button id="collapse" class="iconButton" type="button" title="收合播放器" aria-label="收合播放器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>

      <div id="timeline"><div id="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="音樂進度" disabled></div>
    </div>
    <div id="modeRow">
      <button id="modeCycle" type="button" title="切換播放模式" aria-label="切換播放模式"><svg id="modeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="modeLabel">循環播放</span></button>
      <div id="skipButtons"><button class="iconButton" id="prev" type="button" title="上一首" aria-label="上一首" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 5l-10 7 10 7z"/></svg></button><button class="iconButton" id="next" type="button" title="下一首" aria-label="下一首" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 5l10 7-10 7z"/></svg></button></div>
      <div id="volumeBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg><input id="volume" type="range" min="0" max="100" step="1" value="40" aria-label="音量"></div>
      <span id="modeExplanation" class="visuallyHidden">點擊可切換播放模式</span>
    </div>

      <div id="playlistArea"><label for="trackList" id="playlistLabel">選擇曲目</label><select id="trackList" aria-label="選擇後台上架 BGM"><option value="">正在載入…</option></select></div>
    </div>
    <div id="hint">多多谷官網背景音樂由後台管理。若瀏覽器阻擋自動播放，點一下播放鍵即可；切換官網內頁不會中斷。</div>
  </div>
</div>
<button type="button" id="mini" title="展開 BGM 播放器" aria-label="展開 BGM 播放器"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg></button>
<audio id="music" preload="none"></audio>
<script>
(()=>{
'use strict';
const byId=id=>document.getElementById(id);
const audio=byId('music'),play=byId('play'),seek=byId('seek'),vol=byId('volume'),status=byId('status');
const title=byId('trackName'),select=byId('trackList'),frame=byId('duoduoSite');
const previous=byId('prev'),next=byId('next');
const apiBase=location.hostname.endsWith('github.io')?'https://duoduo-website.onrender.com':'';
const icons={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>'};
const storage={volume:'duoduo_bgm_volume',collapsed:'duoduo_bgm_collapsed',paused:'duoduo_bgm_paused',track:'duoduo_bgm_track',mode:'duoduo_bgm_player_mode'};
const restoreStorageKey='duoduo_bgm_tab_resume_v6';
const read=(key,fallback)=>{try{return localStorage.getItem(key)??fallback;}catch{return fallback;}};
const save=(key,value)=>{try{localStorage.setItem(key,String(value));}catch{}};
let playlist=[],selectedId='',defaultId='',mode='loop',initialLoad=true,cloudLoading=false,playlistSnapshot='';
// Per-player preference overrides the admin default. These are distinct behaviors:
// once = one track then stop; order = play rest of list then stop;
// loop = loop playlist; shuffle = random; repeat-one = replay same track.
const playbackModes=[
  {id:'once',label:'單曲播放',hint:'目前這首播放完就停止'},
  {id:'order',label:'順序播放',hint:'依序播放到最後一首停止'},
  {id:'loop',label:'循環播放',hint:'播放清單播完後重頭開始'},
  {id:'shuffle',label:'隨機播放',hint:'隨機切換下一首'},
  {id:'repeat-one',label:'單曲循環',hint:'重複播放目前這首'}
];
function useMode(nextMode,remember=true){
  mode=playbackModes.some(m=>m.id===nextMode)?nextMode:'loop';
  const item=playbackModes.find(m=>m.id===mode);
  byId('modeLabel').textContent=item.label;
  byId('modeExplanation').textContent=item.hint;
  byId('modeCycle').title=`${item.label}｜${item.hint}（點擊切換）`;
  byId('modeCycle').setAttribute('aria-label',`播放模式：${item.label}。點擊切換`);
  const paths={once:'M7 5v14m5-14 7 7-7 7',order:'M4 6h16M4 12h16M4 18h12',loop:'M4 10V7a3 3 0 0 1 3-3h11l-3-3m3 3-3 3M20 14v3a3 3 0 0 1-3 3H6l3 3m-3-3 3-3',shuffle:'M4 4l5 5m3 3 8 8m-5 0h5v-5M4 20l16-16m-5 0h5v5', 'repeat-one':'M4 10V7a3 3 0 0 1 3-3h11l-3-3m3 3-3 3M20 14v3a3 3 0 0 1-3 3H6l3 3m-3-3 3-3M12 9v7'};
  byId('modeIcon').innerHTML=`<path d="${paths[mode]}"/>`;
  if(remember)save(storage.mode,mode);
}
byId('modeCycle').addEventListener('click',()=>{
  const idx=playbackModes.findIndex(m=>m.id===mode);
  useMode(playbackModes[(idx+1)%playbackModes.length].id);
});
// Tab-scoped restoration avoids carrying an obsolete position across fresh visits.
let pendingResume=null,lastResumeSave=0;
function storePlaybackPosition(){
  if(!selectedId||!Number.isFinite(audio.currentTime))return;
  try{
    if(audio.ended){sessionStorage.removeItem(restoreStorageKey);return;}
    sessionStorage.setItem(restoreStorageKey,JSON.stringify({id:selectedId,seconds:audio.currentTime,at:Date.now()}));
  }catch{}
}
function readPlaybackPosition(id){
  try{
    const record=JSON.parse(sessionStorage.getItem(restoreStorageKey)||'null');
    if(record&&record.id===id&&Date.now()-record.at<5*60*1000&&Number.isFinite(record.seconds)&&record.seconds>0)return record;
  }catch{}
  return null;
}
window.addEventListener('pagehide',storePlaybackPosition);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')storePlaybackPosition();});

const validUrl=value=>{try{const url=new URL(String(value),location.href);return (url.protocol==='https:'||((url.hostname==='localhost'||url.hostname==='127.0.0.1')&&url.protocol==='http:'))?url.href:'';}catch{return '';}};
const format=v=>Number.isFinite(v)?`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`:'0:00';
const refreshPlayback=()=>{play.innerHTML=audio.paused?icons.play:icons.pause;play.setAttribute('aria-label',audio.paused?'播放':'暫停');};
const applyCollapsed=collapsed=>{document.body.classList.toggle('collapsed',collapsed);save(storage.collapsed,collapsed?'1':'0');};
byId('collapse').onclick=()=>applyCollapsed(true);byId('mini').onclick=()=>applyCollapsed(false);
applyCollapsed(read(storage.collapsed,'1')==='1');
const oldVolume=Number(read(storage.volume,'40'));
vol.value=String(Number.isFinite(oldVolume)?Math.max(0,Math.min(100,oldVolume)):40);
// On phones the visible volume slider is hidden: use device hardware volume.
const mobileVolume=window.matchMedia('(max-width:480px)');
function syncDeviceVolume(){audio.volume=mobileVolume.matches?1:Number(vol.value)/100;}
syncDeviceVolume();
mobileVolume.addEventListener?.('change',syncDeviceVolume);
vol.addEventListener('input',()=>{save(storage.volume,vol.value);syncDeviceVolume();});
async function tryPlay(){
  if(!audio.src)return;
  try{await audio.play();status.textContent=`正在播放：${playlist.find(t=>t.id===selectedId)?.title||'多多谷 BGM'}`;}
  catch{status.textContent='瀏覽器阻擋了自動播放，請按播放鍵啟動 BGM。';}
  refreshPlayback();
}
function setTrack(id,{autoplay=true}={}){
  const track=playlist.find(t=>t.id===id);if(!track)return;
  const changed=track.id!==selectedId||audio.src!==track.url;
  selectedId=track.id;select.value=track.id;title.textContent=track.title;save(storage.track,track.id);
  if(changed){audio.src=track.url;audio.load();seek.value='0';byId('elapsed').textContent='0:00';byId('duration').textContent='0:00';}
  play.disabled=false;seek.disabled=false;previous.disabled=playlist.length<2;next.disabled=playlist.length<2;
  if(autoplay)tryPlay();else refreshPlayback();
}
function nextTrack(delta=1){
  if(!playlist.length)return;
  const index=playlist.findIndex(t=>t.id===selectedId);
  let nextIndex;
  if(mode==='shuffle'&&playlist.length>1){nextIndex=Math.floor(Math.random()*(playlist.length-1));if(nextIndex>=(index<0?0:index))nextIndex++;}
  else nextIndex=((index<0?0:index)+delta+playlist.length)%playlist.length;
  setTrack(playlist[nextIndex]?.id||playlist[0].id,{autoplay:read(storage.paused,'0')!=='1'});
}
previous.onclick=()=>nextTrack(-1);next.onclick=()=>nextTrack(1);
select.onchange=()=>setTrack(select.value,{autoplay:read(storage.paused,'0')!=='1'});
play.onclick=async()=>{
  if(!audio.src)return;
  if(!audio.paused){save(storage.paused,'1');audio.pause();status.textContent='已暫停 BGM，網站會記住你的選擇。';}
  else{save(storage.paused,'0');if(audio.ended){try{audio.currentTime=0;}catch{}}await tryPlay();}
};
audio.addEventListener('play',refreshPlayback);audio.addEventListener('pause',refreshPlayback);
audio.addEventListener('ended',()=>{
  try{sessionStorage.removeItem(restoreStorageKey);}catch{}
  if(mode==='repeat-one'){audio.currentTime=0;tryPlay();return;}
  if(mode==='once'||(mode==='order'&&playlist.findIndex(t=>t.id===selectedId)>=playlist.length-1)){
    save(storage.paused,'1');status.textContent='播放已結束，可按播放鍵重新播放。';refreshPlayback();return;
  }
  nextTrack(1);
});
audio.addEventListener('timeupdate',()=>{
  byId('elapsed').textContent=format(audio.currentTime);
  if(Number.isFinite(audio.duration)&&audio.duration>0)seek.value=String(Math.floor(audio.currentTime/audio.duration*1000));
  if(Date.now()-lastResumeSave>=4000){lastResumeSave=Date.now();storePlaybackPosition();}
});
audio.addEventListener('loadedmetadata',()=>{
  byId('duration').textContent=format(audio.duration);
  if(pendingResume&&pendingResume.id===selectedId){
    const record=pendingResume;pendingResume=null;
    try{audio.currentTime=Math.min(record.seconds,Math.max(0,audio.duration-0.25));}catch{}
    byId('elapsed').textContent=format(audio.currentTime);
    if(record.autoplay)tryPlay();
    else status.textContent='已恢復上次播放位置，按播放即可繼續。';
  }
});
audio.addEventListener('error',()=>{if(audio.src)status.textContent='此歌曲載入失敗，請選擇其他曲目，或請管理員確認音訊網址。';});
seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;};
function refreshListUI(){
  select.replaceChildren();
  for(const t of playlist){const option=document.createElement('option');option.value=t.id;option.textContent=t.title;select.append(option);}
  if(!playlist.length){const option=document.createElement('option');option.value='';option.textContent='尚無上架歌曲';select.append(option);}
  select.disabled=!playlist.length;
  if(playlist.some(t=>t.id===selectedId))select.value=selectedId;
}
async function fetchCloud(){
  if(cloudLoading||document.visibilityState==='hidden'||!navigator.onLine)return;
  cloudLoading=true;
  try{
    const response=await fetch(`${apiBase}/api/site-data`,{cache:'no-store',headers:{Accept:'application/json'}});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const json=await response.json();
    if(!json.ok)throw new Error('雲端資料格式錯誤');
    const config=json.data?.duoduo_bgm||{};
    const incoming=(Array.isArray(config.tracks)?config.tracks:[]).filter(t=>t&&t.enabled!==false&&t.id&&t.title&&validUrl(t.url)).map(t=>({id:String(t.id),title:String(t.title),url:validUrl(t.url)}));
    const fingerprint=JSON.stringify({incoming,defaultId:config.defaultId,mode:config.mode});
    if(!initialLoad&&fingerprint===playlistSnapshot)return;
    playlistSnapshot=fingerprint;playlist=incoming;defaultId=String(config.defaultId||'');
    const adminDefaultMode=config.mode==='shuffle'?'shuffle':config.mode==='single'?'repeat-one':'loop';
    useMode(read(storage.mode,adminDefaultMode),false);
    const active=playlist.find(t=>t.id===selectedId);
    if(!playlist.length){audio.pause();audio.removeAttribute('src');audio.load();selectedId='';play.disabled=true;seek.disabled=true;previous.disabled=true;next.disabled=true;title.textContent='尚未上架 BGM';status.textContent='管理員尚未發布任何歌曲。';refreshListUI();refreshPlayback();initialLoad=false;return;}
    const preferred=initialLoad?(playlist.find(t=>t.id===read(storage.track,''))?.id||playlist.find(t=>t.id===defaultId)?.id||playlist[0].id):active?.id||playlist.find(t=>t.id===defaultId)?.id||playlist[0].id;
    const changed=!active||audio.src!==active.url;
    const wasPlaying=!audio.paused;
    refreshListUI();
    if(initialLoad){
      const remembered=readPlaybackPosition(preferred);
      if(remembered){
        pendingResume={...remembered,autoplay:read(storage.paused,'0')!=='1'};
        setTrack(preferred,{autoplay:false});
      }else setTrack(preferred,{autoplay:read(storage.paused,'0')!=='1'});
      if(read(storage.paused,'0')==='1'&&!remembered)status.textContent='你上次暫停了 BGM，按播放鍵即可繼續。';
    }
    else if(changed){setTrack(preferred,{autoplay:(wasPlaying||!selectedId)&&read(storage.paused,'0')!=='1'});}
    else{select.value=selectedId;previous.disabled=playlist.length<2;next.disabled=playlist.length<2;}
    initialLoad=false;
  }catch(error){if(initialLoad)status.textContent='暫時無法讀取後台播放清單，請確認雲端服務，稍後可重新整理。';}
  finally{cloudLoading=false;}
}
// Avoid tearing down the audio element: fetch playlist changes in place.
// Load the main site first. BGM cloud initialization remains independent and
// starts shortly after the inner site loads (or at a bounded fallback).
let cloudStarted=false;
function startCloud(){if(cloudStarted)return;cloudStarted=true;fetchCloud();}
frame.addEventListener('load',()=>{
  try{if(frame.contentWindow.location.href!=='about:blank')startCloud();}catch{startCloud();}
});
setTimeout(startCloud,1200);
setInterval(fetchCloud,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchCloud();});
window.addEventListener('online',fetchCloud);
// V5 navigation: one persistent audio element, one shareable URL per view.
const pageNames={'home.html':'首頁','index.html':'首頁','news.html':'最新消息','events.html':'檔期活動','event-detail.html':'活動詳情','boss.html':'BOSS 介紹','guide.html':'遊玩指南','downloads.html':'下載專區','privacy.html':'隱私政策','terms.html':'使用條款','player-tools/index.html':'玩家工具'};
const siteBase=new URL('./',location.href);
const siteRoot=siteBase.pathname;
const ROUTE_PAGES=new Set(['home.html','news.html','events.html','event-detail.html','boss.html','guide.html','downloads.html','privacy.html','terms.html','player-tools/index.html']);
const ROUTE_KEY='duoduo_v5_route';
let activeFrameDocument=null;

function safePage(raw,base=siteBase){
  try{
    if(!raw||/^\s*(?:javascript:|data:)/i.test(String(raw)))return null;
    const result=new URL(raw,base);
    if(result.origin!==location.origin||!result.pathname.startsWith(siteRoot))return null;
    let relative=result.pathname.slice(siteRoot.length);
    if(!relative||relative==='index.html')relative='home.html';
    if(!ROUTE_PAGES.has(relative))return null;
    return new URL(relative+result.search+result.hash,siteBase);
  }catch{return null;}
}
function routeKey(url){
  const p=url.pathname.slice(siteRoot.length);
  if(p==='home.html'&&!url.search&&!url.hash)return '';
  return p+url.search+url.hash;
}
function outwardUrl(inner){
  const address=new URL('./',siteBase);
  const key=routeKey(inner);
  if(key)address.searchParams.set('page',key);
  return address;
}
function fromLocation(){
  const page=new URLSearchParams(location.search).get('page');
  return safePage(page||'home.html');
}
function currentInner(){
  try{return safePage(frame.contentWindow.location.href);}catch{return null;}
}
function updateAddress(inner,method='push'){
  const destination=outwardUrl(inner);
  if(destination.href===location.href)return;
  const state={...(history.state&&typeof history.state==='object'?history.state:{}),[ROUTE_KEY]:routeKey(inner)};
  if(method==='push')history.pushState(state,'',destination);
  else history.replaceState(state,'',destination);
}
function showCurrentPage(inner){
  const relative=inner.pathname.slice(siteRoot.length);
  byId('pageTitle').textContent=`目前：${pageNames[relative]||'官網頁面'}`;
}
function changeInner(to,method='push'){
  const target=safePage(to);
  if(!target)return false;
  const current=currentInner();
  updateAddress(target,method);
  if(current&&current.href===target.href){showCurrentPage(target);return true;}
  if(current&&current.pathname===target.pathname&&current.search===target.search){
    // Same page, different anchor: no page or audio reload, no iframe history duplication.
    try{
      const w=frame.contentWindow;
      w.history.replaceState(w.history.state,'',target.href);
      if(target.hash){
        const name=decodeURIComponent(target.hash.slice(1));
        w.document.getElementById(name)?.scrollIntoView();
      }else{w.scrollTo(0,0);}
      w.dispatchEvent(new Event('hashchange'));
      showCurrentPage(target);
      return true;
    }catch{}
  }
  try{frame.contentWindow.location.replace(target.href);}catch{frame.src=target.href;}
  showCurrentPage(target);
  return true;
}
function synchronizeFromFrame(){
  const current=currentInner();
  if(!current)return;
  updateAddress(current,'replace');
  showCurrentPage(current);
}
function wirePage(){
  const doc=frame.contentDocument;
  if(!doc||doc===activeFrameDocument)return;
  activeFrameDocument=doc;
  const win=frame.contentWindow;
  // Keep real links in the original documents (copy-link and new-tab still work).
  // Normal same-tab clicks use the outer router so iframe history is not duplicated.
  doc.addEventListener('click',event=>{
    if(event.defaultPrevented||event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
    const element=event.target?.nodeType===1?event.target:event.target?.parentElement;
    const a=element?.closest?.('a[href]');
    if(!a||a.hasAttribute('download')||a.target==='_blank'||a.target==='_top'||a.target==='_parent')return;
    const url=safePage(a.getAttribute('href'),doc.baseURI);
    if(!url)return;
    event.preventDefault();
    changeInner(url,'push');
  },true);
  // Some pages (e.g. news details) call history.pushState themselves.
  // Their iframe already creates a session-history entry: mirror with replace,
  // not another push, to avoid requiring two Back presses.
  for(const name of ['pushState','replaceState']){
    try{
      const old=win.history[name].bind(win.history);
      win.history[name]=function(...args){
        const result=old(...args);
        synchronizeFromFrame();
        return result;
      };
    }catch{}
  }
  win.addEventListener('popstate',synchronizeFromFrame);
  win.addEventListener('hashchange',synchronizeFromFrame);
}
frame.addEventListener('load',()=>{
  const inner=currentInner();
  if(!inner)return;
  wirePage();
  synchronizeFromFrame();
});
window.addEventListener('popstate',()=>{
  const want=fromLocation();
  if(!want)return;
  const have=currentInner();
  if(!have||have.href!==want.href)changeInner(want,'replace');
  else showCurrentPage(want);
});
// Don't load the old homepage before the requested shareable subpage.
const firstPage=fromLocation()||safePage('home.html');
frame.src=firstPage.href;
showCurrentPage(firstPage);

// Preserve update detection for the new public entry (no forced reload when unchanged).
const shellVersion=document.querySelector('meta[name="duoduo-shell-version"]')?.content||'';
let shellChecking=false;
async function checkShellVersion(){
  if(shellChecking||document.visibilityState==='hidden'||!navigator.onLine)return;
  shellChecking=true;
  try{
    const response=await fetch(new URL('index.html',siteBase),{cache:'no-store'});
    if(!response.ok)return;
    const remote=await response.text();
    const next=remote.match(/<meta name="duoduo-shell-version" content="([^"]+)"/);
    if(next&&shellVersion&&next[1]!==shellVersion){storePlaybackPosition();window.location.reload();}
  }catch{}finally{shellChecking=false;}
}
setInterval(checkShellVersion,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkShellVersion();});
window.addEventListener('online',checkShellVersion);
})();
</script>
