async function pageLoadNews(){
  const API_BASE=window.location.hostname.endsWith('github.io')?'https://duoduo-website.onrender.com':'';
  try{
    const res=await fetch(`${API_BASE}/api/site-data`,{headers:{Accept:'application/json'},cache:'no-store'});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const payload=await res.json();
    const cloudNews=payload?.data?.duoduo_news;
    if(Array.isArray(cloudNews))return cloudNews.filter(n=>n&&typeof n==='object');
    return [];
  }catch(e){
    console.warn('雲端公告讀取失敗，使用本機公告資料。',e);
    try{
      const raw=localStorage.getItem('duoduo_news');
      const parsed=raw?JSON.parse(raw):null;
      if(Array.isArray(parsed))return parsed.filter(n=>n&&typeof n==='object');
    }catch(e){}
    return pageDefaultNews.slice();
  }
}
function pageDateValue(n){
  const raw=String(n?.date??'').trim();
  if(!raw)return Number.MIN_SAFE_INTEGER;
  const normalized=raw.replace(/\s+/g,' ').replace(/\s*([\/\-])\s*/g,'$1');
  const m=normalized.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[T ]+(\d{1,2})(?::(\d{1,2}))?(?::(\d{1,2}))?)?$/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));
    const t=d.getTime();
    if(Number.isFinite(t))return t;
  }
  const t=Date.parse(normalized);
  return Number.isFinite(t)?t:Number.MIN_SAFE_INTEGER;
}
let pageNewsData=[];
function pageRenderList(category='全部',requestedPage=1){
  pageDetail.hidden=true; pageList.hidden=false;
  currentCategory=category;
  pageButtons.forEach(b=>b.classList.toggle('active',b.dataset.category===category));
  const filtered=pageNewsData.map((n,i)=>({n,i})).filter(x=>category==='全部'||String(x.n.tag||'')===category).sort((a,b)=>{const dt=pageDateValue(b.n)-pageDateValue(a.n);if(dt)return dt;const cb=Number(b.n?.createdAt)||0,ca=Number(a.n?.createdAt)||0;if(cb!==ca)return ca-cb;return a.i-b.i;});
  const totalPages=Math.max(1,Math.ceil(filtered.length/NEWS_PER_PAGE));
  currentPage=Math.min(Math.max(1,Number(requestedPage)||1),totalPages);
  if(!filtered.length){pageList.innerHTML='<div class="news-empty">目前沒有這個分類的公告。</div>';pagePagination.innerHTML='';return;}
  const start=(currentPage-1)*NEWS_PER_PAGE;
  const visible=filtered.slice(start,start+NEWS_PER_PAGE);
  pageList.innerHTML=visible.map(({n,i})=>`<button class="news-title-row" data-index="${i}" type="button"><span class="tag ${pageTagClass(n.tag)}">${pageEsc(pageTagShort(n.tag||'未分類'))}</span><span class="news-title-text">${pageEsc(n.title||'未命名公告')}</span><time>${pageEsc(n.date||'')}</time><span class="news-arrow">→</span></button>`).join('');
  if(totalPages<=1){pagePagination.innerHTML='';return;}
  const buttons=[];
  buttons.push(`<button type="button" class="news-page-btn" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}>上一頁</button>`);
  for(let p=1;p<=totalPages;p++) buttons.push(`<button type="button" class="news-page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`);
  buttons.push(`<button type="button" class="news-page-btn" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}>下一頁</button>`);
  pagePagination.innerHTML=buttons.join('');
  pagePagination.querySelectorAll('.news-page-btn').forEach(btn=>btn.addEventListener('click',()=>{if(btn.disabled)return;pageRenderList(currentCategory,Number(btn.dataset.page));window.scrollTo({top:document.querySelector('.news-wrap')?.offsetTop||0,behavior:'smooth'});}));
}
function pageCloseDetail(updateHistory=true){

};

function newsIcon(name){
  return `<svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NEWS_ICON_PATHS[name]||NEWS_ICON_PATHS.file}</svg>`;
}
// 先逐字跳脫再處理受控的 Discord/Markdown 標記；不執行公告內的 HTML。
function newsInline(value){
  let input=String(value??'');
  if((input.match(/\*\*/g)||[]).length%2===1) input=input.replace(/\*\*\s*$/,'');
  const token=/<a:([A-Za-z0-9_]{1,40}):(\d{15,22})>|<:([A-Za-z0-9_]{1,40}):(\d{15,22})>|<@&\d{15,22}>|<@!?\d{15,22}>|<#\d{15,22}>|\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)<>]+)\)|\*\*([^*\n]+)\*\*|__([^_\n]+)__|~~([^~\n]+)~~|`([^`\n]+)`/g;
  let result='',last=0,match;
  while((match=token.exec(input))!==null){
    result+=pageEsc(input.slice(last,match.index));
    const whole=match[0];
    if(match[1]||match[3]){
      const animated=!!match[1],name=match[1]||match[3],id=match[2]||match[4];
      const ext=animated?'gif':'png';
      result+=`<img class="news-discord-emoji" src="https://cdn.discordapp.com/emojis/${id}.${ext}?size=48" alt=":${pageEsc(name)}:" title=":${pageEsc(name)}:" loading="lazy">`;
    }else if(whole.startsWith('<@&')) result+='<span class="news-mention">@身分組</span>';
    else if(whole.startsWith('<@')) result+='<span class="news-mention">@使用者</span>';
    else if(whole.startsWith('<#')) result+='<span class="news-mention">#頻道</span>';
    else if(match[5]) result+=`<a href="${pageEsc(match[6])}" target="_blank" rel="noopener noreferrer">${pageEsc(match[5])}</a>`;
    else if(match[7]) result+=`<strong>${pageEsc(match[7])}</strong>`;
    else if(match[8]) result+=`<u>${pageEsc(match[8])}</u>`;
    else if(match[9]) result+=`<s>${pageEsc(match[9])}</s>`;
    else if(match[10]) result+=`<code>${pageEsc(match[10])}</code>`;
    last=token.lastIndex;
  }
  return result+pageEsc(input.slice(last));
}
function newsHeading(line){
  const normalized=String(line).trim().replace(/^(?:#{1,4}\s*)/,'').replace(/^[★☆⭐🌟📌📢🎁🎫⏰📝📜🔔ℹ️\s]+/u,'').replace(/\s*[:：]\s*$/,'').trim();
  if(NEWS_HEADINGS[normalized])return {name:normalized,icon:NEWS_HEADINGS[normalized]};
  return null;
}
function newsRewardItems(line){
  const text=String(line).trim();
  const re=/([^\s　,，、]+?)\s*[×xX＊*]\s*(\d[\d,]*)/g;
  const matched=[...text.matchAll(re)];
  if(matched.length<2)return null;
  const remaining=text.replace(re,'').replace(/[\s　,，、，;；|｜]+/g,'');
  if(remaining)return null;
  return matched.map(m=>({label:m[1],quantity:m[2]}));
}
function newsRenderedBody(raw){
  const text=String(raw??'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ');
  const lines=text.split('\n');
  const blocks=[];
  let buffer=[],list=[],listType='',group=[];
  let currentHeading='',section=[];
  function finishParagraph(){if(buffer.length){blocks.push(`<p class="news-paragraph">${buffer.map(newsInline).join('<br>')}</p>`);buffer=[];}}
  function finishList(){if(list.length){blocks.push(`<${listType} class="news-readable-list">${list.map(x=>`<li>${newsInline(x)}</li>`).join('')}</${listType}>`);list=[];listType='';}}
  function finishGroup(){if(group.length){blocks.push(`<div class="news-reward-grid">${group.map(x=>`<div class="news-reward-item"><span>${newsInline(x.label)}</span><strong>×${pageEsc(x.quantity)}</strong></div>`).join('')}</div>`);group=[];}}
  function finishSection(){finishParagraph();finishList();finishGroup();if(currentHeading){section.push(...blocks);blocks.length=0;const icon=NEWS_HEADINGS[currentHeading];const headingHtml=`<h3 class="news-section-heading">${newsIcon(icon)}<span>${pageEsc(currentHeading)}</span></h3>`;const contentHtml=section.join('');section=[];sections.push(`<section class="news-section">${headingHtml}${contentHtml}</section>`);}else{intro.push(...blocks);blocks.length=0;}}
  const sections=[],intro=[];
  for(const untrimmed of lines){
    const line=untrimmed.trim();
    const heading=newsHeading(line);
    if(heading){finishSection();currentHeading=heading.name;continue;}
    if(!line){finishParagraph();finishList();finishGroup();continue;}
    const rewards=/^(序號內容物|獎勵內容|活動獎勵|補償內容|補償獎勵|獎勵清單)$/.test(currentHeading)?newsRewardItems(line):null;
    if(rewards){finishParagraph();finishList();group.push(...rewards);continue;}
    finishGroup();
    if(/^(兌換序號|序號兌換|序號資訊)$/.test(currentHeading)&&/^[A-Za-z0-9][A-Za-z0-9_-]{3,49}$/.test(line)){
      finishParagraph();finishList();blocks.push(`<div class="news-code-box"><code>${pageEsc(line)}</code><button type="button" class="news-code-copy" data-copy-code="${pageEsc(line)}" aria-label="複製兌換序號">${newsIcon('ticket')}<span>複製序號</span></button></div>`);continue;
    }
    const unordered=line.match(/^(?:[-*•·・])\s+(.+)$/),ordered=line.match(/^\d+[.、．)]\s*(.+)$/);
    if(unordered||ordered){finishParagraph();const wanted=ordered?'ol':'ul';if(list.length&&listType!==wanted)finishList();listType=wanted;list.push((ordered||unordered)[1]);continue;}
    finishList();buffer.push(line);
  }
  finishSection();
  return `<div class="news-readable-body">${intro.join('')}${sections.join('')}</div>`;
}
async function newsCopyCode(button){
  const value=button.getAttribute('data-copy-code');
  if(!value)return;
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);
    else {
      const temp=document.createElement('textarea');temp.value=value;temp.style.position='fixed';temp.style.opacity='0';document.body.appendChild(temp);temp.select();
      const copied=document.execCommand('copy');temp.remove();if(!copied)throw new Error('copy failed');
    }
    const label=button.querySelector('span');if(label)label.textContent='已複製';
  }catch(err){window.prompt('請複製以下序號：',value);}

/* 前台新版公告：明確的後台欄位，不靠推測公告文字的標題。 */
function newsSectionSvg(icon){
  const key=String(icon||'file-text');const path=DUODUO_NEWS_ICON_PATHS[key]||DUODUO_NEWS_ICON_PATHS['file-text'];
  return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
}
function newsPlainContent(raw){
 const lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n');
 let out=[],list=[],type='',paragraph=[];
 const flushP=()=>{if(paragraph.length){out.push(`<p class="news-paragraph">${paragraph.map(newsInline).join('<br>')}</p>`);paragraph=[];}};
 const flushList=()=>{if(list.length){out.push(`<${type} class="news-readable-list">${list.map(x=>`<li>${newsInline(x)}</li>`).join('')}</${type}>`);list=[];type='';}};
 for(const input of lines){const x=input.trim();if(!x){flushP();flushList();continue;}
  const unordered=x.match(/^(?:[-*•·・])\s+(.+)$/),ordered=x.match(/^\d+[.、．)]\s*(.+)$/);
  if(unordered||ordered){flushP();const wanted=ordered?'ol':'ul';if(list.length&&type!==wanted)flushList();type=wanted;list.push((unordered||ordered)[1]);continue;}
  flushList();paragraph.push(x);
 }flushP();flushList();return out.join('');
}
function newsRewardCards(raw){
 const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length)return '';
 let items=[];
 for(const line of lines){
  const multiple=newsRewardItems(line);
  if(multiple){items.push(...multiple);continue;}
  const m=line.match(/^(.+?)\s*[×xX*＊]\s*([\d,]+)\s*$/);
  if(!m)return newsPlainContent(raw);
  items.push({label:m[1].trim(),quantity:m[2]});
 }
 return `<div class="news-reward-grid">${items.map(x=>`<div class="news-reward-item"><span>${newsInline(x.label)}</span><strong>×${pageEsc(x.quantity)}</strong></div>`).join('')}</div>`;
}
function newsStructuredBody(n){
 const blocks=Array.isArray(n.newsSections)?n.newsSections.filter(x=>x&&typeof x==='object'&&String(x.body||'').trim()):[];
 const serial=n.tag==='序號發放'&&n.newsSerial&&typeof n.newsSerial==='object'?n.newsSerial:null;
 const hasCode=serial&&Object.values(serial).some(x=>typeof x==='string'&&x.trim());
 const lead=String(n.newsLead||'').trim();
 if(!lead&&!blocks.length&&!hasCode)return newsRenderedBody(n.body||'');
 let out='<div class="news-readable-body news-structured">';
 if(lead)out+=`<div class="news-structured-intro">${newsPlainContent(lead)}</div>`;
 for(const item of blocks){
  const title=String(item.title||'').trim()||'公告內容';
  const body=String(item.body||'');
  const gift=/(?:^|\b)(rewards|compensation)(?:$|\b)/.test(String(item.type||''));
  out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg(item.icon)}<span>${pageEsc(title)}</span></h3>${gift?newsRewardCards(body):newsPlainContent(body)}</section>`;
 }
 if(hasCode){
  const s=serial;
  if(s.code){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('ticket')}<span>兌換序號</span></h3><div class="news-code-box"><code>${pageEsc(s.code)}</code><button type="button" class="news-code-copy" data-copy-code="${pageEsc(s.code)}" aria-label="複製兌換序號">${newsIcon('ticket')}<span>複製序號</span></button></div></section>`;}
  if(s.expiry){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('clock')}<span>兌換期限</span></h3>${newsPlainContent(s.expiry)}</section>`;}
  if(s.method){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('list-checks')}<span>使用方式</span></h3>${newsPlainContent(s.method)}</section>`;}
  if(s.rewards){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('gift')}<span>序號獎勵</span></h3>${newsRewardCards(s.rewards)}</section>`;}
  if(s.notes){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('info')}<span>兌換注意事項</span></h3>${newsPlainContent(s.notes)}</section>`;}
 }
 if(n.newsIncludeLegacy&&n.body){out+=`<section class="news-section"><h3 class="news-section-heading">${newsSectionSvg('file-text')}<span>補充說明</span></h3>${newsRenderedBody(n.body)}</section>`;}
 return out+'</div>';
}

function pageShowDetail(index){
  const n=pageNewsData[index];
  if(!n)return;
  pageDetail.hidden=false;
  document.body.classList.add('news-modal-open');
  pageDetail.innerHTML=`<div class="news-modal-backdrop" data-close-news></div><div class="news-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="news-modal-title"><button class="news-modal-close" type="button" aria-label="關閉公告" data-close-news>×</button><article class="news-detail-card"><div class="news-detail-meta"><span class="tag ${pageTagClass(n.tag)}">${pageEsc(pageTagShort(n.tag||'未分類'))}</span><time class="meta">${pageEsc(n.date||'')}</time></div><h2 id="news-modal-title">${pageEsc(n.title||'未命名公告')}</h2><div class="news-body">${newsStructuredBody(n)}</div></article></div>`;
  pageDetail.querySelectorAll('[data-close-news]').forEach(el=>el.addEventListener('click',()=>pageCloseDetail(true)));
  pageDetail.querySelectorAll('[data-copy-code]').forEach(el=>el.addEventListener('click',()=>newsCopyCode(el)));
  pageDetail.querySelectorAll('.news-discord-emoji').forEach(img=>img.addEventListener('error',()=>img.replaceWith(document.createTextNode(img.alt))));
  history.pushState({},'',`${location.pathname}?id=${index}`);
}

pageButtons.forEach(b=>b.addEventListener('click',()=>pageRenderList(b.dataset.category,1)));
pageList.addEventListener('click',e=>{const row=e.target.closest('.news-title-row');if(row)pageShowDetail(Number(row.dataset.index));});
function pageOpenFromUrl(){const params=new URLSearchParams(location.search);let id=params.get('id');if(id===null&&location.hash.startsWith('#n-'))id=location.hash.slice(3);if(id!==null&&pageNewsData[Number(id)])pageShowDetail(Number(id));else pageRenderList('全部');}
window.addEventListener('popstate',pageOpenFromUrl);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pageDetail.hidden)pageCloseDetail(true);});
pageLoadNews().then(loaded=>{
  pageNewsData=loaded.map((item,index)=>({item,index})).sort((a,b)=>{const dt=pageDateValue(b.item)-pageDateValue(a.item);if(dt)return dt;const cb=Number(b.item?.createdAt)||0,ca=Number(a.item?.createdAt)||0;if(cb!==ca)return ca-cb;return a.index-b.index;}).map(x=>x.item);
  pageOpenFromUrl();
});
})();
</script>
<style>
.news-wrap{padding-top:10px}
.news-filter{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.news-filter-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;font:inherit;transition:.2s}
.news-filter-btn:hover,.news-filter-btn.active{color:#fff;border-color:#4ecbff;background:#123047}
.news-title-list{display:grid;gap:10px}
.news-title-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:16px;text-align:left;padding:20px 22px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;cursor:pointer;font:inherit;transition:.2s}
.news-title-row:hover{transform:translateY(-1px);border-color:#4ecbff;background:#12253a}
.news-title-text{font-size:18px;font-weight:700;min-width:0}
.news-title-row time{font-size:13px;color:var(--muted2);white-space:nowrap}
.news-arrow{font-size:20px;color:#66d8ff}
.news-empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.news-pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.news-page-btn{min-width:40px;height:40px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;cursor:pointer;font:inherit;transition:.2s}
.news-page-btn:hover:not(:disabled),.news-page-btn.active{color:#fff;border-color:#4ecbff;background:#123047}
.news-page-btn:disabled{opacity:.4;cursor:not-allowed}
.news-detail{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.news-detail[hidden]{display:none}
.news-modal-backdrop{position:absolute;inset:0;background:rgba(2,10,20,.72);backdrop-filter:blur(4px)}
.news-modal-dialog{position:relative;z-index:1;width:min(900px,100%);max-height:min(86vh,900px);overflow:auto;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.news-detail-card{position:relative;margin:0;padding:34px 38px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.news-detail-card h2{font-size:clamp(25px,3.25vw,34px);line-height:1.38;margin:14px 48px 20px 0;overflow-wrap:anywhere;letter-spacing:.01em}
.news-detail-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.news-detail-card .news-detail-meta .meta{color:var(--muted2);font-size:13px;margin:0}
.news-body{color:var(--muted);font-size:16px;line-height:1.8;white-space:normal;overflow-wrap:anywhere}
.news-readable-body{display:grid;gap:12px}
.news-paragraph{margin:0;line-height:1.85}
.news-readable-body a{color:#168ac8;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.news-readable-body strong{color:var(--text);font-weight:700}
.news-readable-body code{font-size:.95em;background:rgba(90,150,190,.09);padding:1px 4px;border-radius:4px}
.news-discord-emoji{display:inline-block;width:1.28em;height:1.28em;vertical-align:-.24em;object-fit:contain}
.news-mention{display:inline;border-radius:4px;background:rgba(90,150,190,.12);padding:1px 4px;font-size:.94em}
.news-section{margin-top:7px;padding-top:19px;border-top:1px solid var(--line);display:grid;gap:12px;min-width:0}
.news-section-heading{display:flex;align-items:center;gap:10px;margin:0;color:var(--text);font-size:18px;line-height:1.4;font-weight:750}
.news-section-heading svg{flex:none;color:#249bc3}
.news-readable-list{margin:0;padding-left:24px;display:grid;gap:6px}
.news-readable-list li{padding-left:3px}
.news-reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.news-reward-item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:rgba(100,150,185,.065)}
.news-reward-item span{min-width:0;overflow-wrap:anywhere}
.news-reward-item strong{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.news-code-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:rgba(95,165,200,.08);border:1px solid var(--line);border-radius:12px}
.news-code-box code{background:none;padding:0;font-weight:750;font-size:17px;color:var(--text);word-break:break-all}
.news-code-copy{display:inline-flex;align-items:center;gap:5px;flex:none;border:1px solid #65a8c8;background:rgba(50,125,170,.12);border-radius:9px;padding:8px 11px;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.news-code-copy:hover{border-color:#3bc5ed;background:rgba(65,170,210,.16)}
.news-code-copy svg{width:15px;height:15px}
.news-modal-close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;cursor:pointer;font-size:28px;line-height:1;font-family:inherit}
.news-modal-close:hover{border-color:#4ecbff;color:#66d8ff}
.news-modal-open{overflow:hidden}
@media(max-width:700px){.news-title-row{grid-template-columns:auto 1fr auto}.news-title-row time{grid-column:2}.news-arrow{grid-column:3;grid-row:1/3}.news-title-text{font-size:16px}.news-detail{padding:12px}.news-modal-dialog{max-height:88vh}.news-detail-card{padding:26px 22px}.news-detail-card h2{font-size:25px;margin-right:38px}.news-body{font-size:15px;line-height:1.8}.news-reward-grid{grid-template-columns:1fr}.news-section-heading{font-size:17px}.news-code-box{flex-wrap:wrap}}

<!-- DuoDuo public pages: refresh after published cloud content changes -->
<script id="duoduo-public-cloud-refresh">
(() => {
  'use strict';
  const INTERVAL_MS = 60000;
  const API_BASE = location.hostname.endsWith('github.io') ? 'https://duoduo-website.onrender.com' : '';
  const isTools = /\/player-tools\/index\.html$/i.test(location.pathname);
  const page = isTools ? 'player-tools' : (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  const common = isTools ? ['duoduo_settings'] : ['duoduo_settings', 'duoduo_links'];
  const byPage = {
    'index.html': ['duoduo_news', 'duoduo_reviews', 'duoduo_content', 'duoduo_hero',
      'duoduo_layout', 'duoduo_resources', 'duoduo_downloads', 'duoduo_items',
      'duoduo_events', 'duoduo_boss_config'],
    'news.html': ['duoduo_news'],
    'events.html': ['duoduo_events'],
    'event-detail.html': ['duoduo_events'],
    'boss.html': ['duoduo_boss_config'],
    'downloads.html': ['duoduo_downloads', 'duoduo_resources', 'duoduo_items'],
    'guide.html': ['duoduo_resources', 'duoduo_content', 'duoduo_items'],
    'player-tools': ['duoduo_pools', 'duoduo_weekly_prizes']
  };
  const keys = [...new Set([...common, ...(byPage[page] || [])])];
  const snapshots = new Map();
  let checking = false;

  async function checkCloudChanges() {
    if (checking || document.visibilityState === 'hidden' || !navigator.onLine) return;
    checking = true;
    try {
      const response = await fetch(`${API_BASE}/api/site-data`, {
        method: 'GET', headers: { Accept: 'application/json' }, cache: 'no-store'
      });
      if (!response.ok) return;
      const payload = await response.json();
      if (payload?.ok !== true || payload.initialized !== true ||
          !payload.data || typeof payload.data !== 'object') return;
      const data = payload.data;
      for (const key of keys) {
        // A temporarily missing event/BOSS field can mean a failed subquery;
        // do not treat it as a published deletion or trigger a reload loop.
        if (!Object.prototype.hasOwnProperty.call(data, key)) continue;
        const value = JSON.stringify(data[key]);
        if (snapshots.has(key) && snapshots.get(key) !== value) {
          location.reload();
          return;
        }
        snapshots.set(key, value);
      }
    } catch (_) {
      // Failed or offline checks are retried; never refresh on network errors.
    } finally {
      checking = false;
    }
  }

  checkCloudChanges();
  window.setInterval(checkCloudChanges, INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkCloudChanges();
  });
  window.addEventListener('online', checkCloudChanges);
})();
</script>
<!-- DuoDuo public pages: automatic refresh on published HTML changes -->
<script id="duoduo-public-auto-refresh">
(() => {
  'use strict';
  const INTERVAL_MS = 60000;
  const pageUrl = new URL(window.location.pathname, window.location.origin);
  const siteRoot = new URL('./', pageUrl);
  const watchUrls = [...new Set([pageUrl.href, new URL('index.html', siteRoot).href])];
  const known = new Map();
  let checking = false;
  let ready = false;

  async function readPage(url) {
    const requestUrl = new URL(url);
    requestUrl.searchParams.set('_duoduo_check', Date.now().toString());
    const response = await fetch(requestUrl.href, { cache: 'no-store', credentials: 'same-origin' });
    if (!response.ok) throw new Error('Update check failed: ' + response.status);
    return response.text();
  }

  async function check() {
    if (checking || document.visibilityState === 'hidden' || !navigator.onLine) return;
    checking = true;
    try {
      const responses = await Promise.all(watchUrls.map(readPage));
      if (!ready) {
        responses.forEach((html, index) => known.set(watchUrls[index], html));
        ready = true;
        return;
      }
      if (responses.some((html, index) => html !== known.get(watchUrls[index]))) {
        window.location.reload();
      }
    } catch (_) {
      // Network and deployment errors are retried on the next check.
    } finally {
      checking = false;
    }
  }

  check();
  window.setInterval(check, INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') check();
  });
  window.addEventListener('online', check);
})();
</script>
