<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最新公告｜DuoDuo Valley</title><link rel="stylesheet" href="styles.css"></head><body>

  <a class="brand" href="index.html"><img src="assets/logo1.png" alt="多多谷"><span>DuoDuo Valley</span></a>
  <nav class="main-nav">
    <a class="nav-pill" data-nav="home" href="index.html">首頁</a>
    <a class="nav-pill" data-nav="why" href="index.html#why">為什麼選多多谷</a>

    <a class="nav-pill" data-nav="events" href="events.html">檔期活動</a>
    <a class="nav-pill" data-nav="boss" href="boss.html">BOSS</a>
    <a class="nav-pill" data-nav="news" href="news.html">最新消息</a>
    <a class="nav-pill" data-nav="guide" href="guide.html">遊玩指南</a><a class="nav-pill" data-nav="downloads" href="downloads.html">下載專區</a>
  </nav>
  <div class="header-status"><span class="status-dot"></span><span>V282 持續更新</span></div>
  <div class="header-actions">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色模式與淺色模式"><span id="themeIcon">☼</span><span id="themeLabel">淺色模式</span></button>
    <a class="btn btn-gold" data-link="topup" target="_blank">儲值</a>
    <a class="btn btn-discord" data-link="discord" target="_blank">加入 Discord</a>
  </div>
</header>
<section class="page-hero"><span class="eyebrow">NEWS</span><h1>最新公告</h1><p>集中整理多多谷的重要消息、活動資訊、更新說明、序號與福利公告。</p></section>
<main class="content-wrap news-wrap">
  <div class="news-filter" role="tablist" aria-label="公告分類">
    <button class="news-filter-btn active" data-category="全部">全部</button>
    <button class="news-filter-btn" data-category="重要消息">重要</button>
    <button class="news-filter-btn" data-category="維護通知">維護</button>
    <button class="news-filter-btn" data-category="更新說明">更新</button>
    <button class="news-filter-btn" data-category="活動資訊">活動</button>
    <button class="news-filter-btn" data-category="序號發放">序號</button>
    <button class="news-filter-btn" data-category="處分名單">處分</button>
  </div>
  <div id="news-page" class="news-title-list"></div>
  <div id="news-detail" class="news-detail" hidden></div>
</main>
<script src="app.js"></script><script>
(function(){
const pageDefaultNews=[
  {tag:'重要消息',title:'DuoDuo Valley 官方網站持續完善中',date:'2026/10/04',body:'多多谷官方網站正在持續整理遊戲資訊、活動與玩家資源。'},
  {tag:'活動資訊',title:'多多谷最新活動與福利，持續更新中',date:'2026/10/04',body:'活動檔期與福利資訊請以官方公告為準。'},
  {tag:'更新說明',title:'遊戲內容與系統資訊請留意官方公告',date:'2026/10/04',body:'後續將持續補充更多遊戲系統與版本資訊。'}
];
const pageList=document.getElementById('news-page'), pageDetail=document.getElementById('news-detail');
const pagePagination=document.createElement('div');
pagePagination.className='news-pagination';
pageList.insertAdjacentElement('afterend',pagePagination);
const pageButtons=[...document.querySelectorAll('.news-filter-btn')];
const NEWS_PER_PAGE=10;
let currentCategory='全部';
let currentPage=1;
const pageEsc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pageTagShort=t=>({'重要消息':'重要','維護通知':'維護','更新說明':'更新','活動資訊':'活動','序號發放':'序號','處分名單':'處分'}[t]||t);
const pageTagClass=t=>({'重要消息':'category-important','維護通知':'category-maintenance','更新說明':'category-update','活動資訊':'category-event','序號發放':'category-code','處分名單':'category-punishment'}[String(t||'')]||'category-default');
async function pageLoadNews(){
  const API_BASE=window.location.hostname.endsWith('github.io')?'https://duoduo-website.onrender.com':'';
  try{
    const res=await fetch(`${API_BASE}/api/site-data`,{headers:{Accept:'application/json'},cache:'no-store'});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const payload=await res.json();
    const cloudNews=payload?.data?.duoduo_news;
    if(Array.isArray(cloudNews))return cloudNews.filter(n=>n&&typeof n==='object');
    return [];
  }catch(e){
    console.warn('雲端公告讀取失敗，使用本機公告資料。',e);
    try{
      const raw=localStorage.getItem('duoduo_news');
      const parsed=raw?JSON.parse(raw):null;
      if(Array.isArray(parsed))return parsed.filter(n=>n&&typeof n==='object');
    }catch(e){}
    return pageDefaultNews.slice();
  }
}
function pageDateValue(n){
  const raw=String(n?.date??'').trim();
  if(!raw)return Number.MIN_SAFE_INTEGER;
  const normalized=raw.replace(/\s+/g,' ').replace(/\s*([\/\-])\s*/g,'$1');
  const m=normalized.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[T ]+(\d{1,2})(?::(\d{1,2}))?(?::(\d{1,2}))?)?$/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));
    const t=d.getTime();
    if(Number.isFinite(t))return t;
  }
  const t=Date.parse(normalized);
  return Number.isFinite(t)?t:Number.MIN_SAFE_INTEGER;
}
let pageNewsData=[];
function pageRenderList(category='全部',requestedPage=1){
  pageDetail.hidden=true; pageList.hidden=false;
  currentCategory=category;
  pageButtons.forEach(b=>b.classList.toggle('active',b.dataset.category===category));
  const filtered=pageNewsData.map((n,i)=>({n,i})).filter(x=>category==='全部'||String(x.n.tag||'')===category).sort((a,b)=>{const dt=pageDateValue(b.n)-pageDateValue(a.n);if(dt)return dt;const cb=Number(b.n?.createdAt)||0,ca=Number(a.n?.createdAt)||0;if(cb!==ca)return cb-ca;return a.i-b.i;});
  const totalPages=Math.max(1,Math.ceil(filtered.length/NEWS_PER_PAGE));
  currentPage=Math.min(Math.max(1,Number(requestedPage)||1),totalPages);
  if(!filtered.length){pageList.innerHTML='<div class="news-empty">目前沒有這個分類的公告。</div>';pagePagination.innerHTML='';return;}
  const start=(currentPage-1)*NEWS_PER_PAGE;
  const visible=filtered.slice(start,start+NEWS_PER_PAGE);
  pageList.innerHTML=visible.map(({n,i})=>`<button class="news-title-row" data-index="${i}" type="button"><span class="tag ${pageTagClass(n.tag)}">${pageEsc(pageTagShort(n.tag||'未分類'))}</span><span class="news-title-text">${pageEsc(n.title||'未命名公告')}</span><time>${pageEsc(n.date||'')}</time><span class="news-arrow">→</span></button>`).join('');
  if(totalPages<=1){pagePagination.innerHTML='';return;}
  const buttons=[];
  buttons.push(`<button type="button" class="news-page-btn" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}>上一頁</button>`);
  for(let p=1;p<=totalPages;p++) buttons.push(`<button type="button" class="news-page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`);
  buttons.push(`<button type="button" class="news-page-btn" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}>下一頁</button>`);
  pagePagination.innerHTML=buttons.join('');
  pagePagination.querySelectorAll('.news-page-btn').forEach(btn=>btn.addEventListener('click',()=>{if(btn.disabled)return;pageRenderList(currentCategory,Number(btn.dataset.page));window.scrollTo({top:document.querySelector('.news-wrap')?.offsetTop||0,behavior:'smooth'});}));
}
function pageCloseDetail(updateHistory=true){
  pageDetail.hidden=true;
  pageDetail.innerHTML='';
  document.body.classList.remove('news-modal-open');
  if(updateHistory && (location.search||location.hash)) history.pushState({},'',location.pathname);
}
function pageShowDetail(index){
  const n=pageNewsData[index];
  if(!n)return;
  pageDetail.hidden=false;
  document.body.classList.add('news-modal-open');
  pageDetail.innerHTML=`<div class="news-modal-backdrop" data-close-news></div><div class="news-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="news-modal-title"><button class="news-modal-close" type="button" aria-label="關閉公告" data-close-news>×</button><article class="news-detail-card"><span class="tag ${pageTagClass(n.tag)}">${pageEsc(pageTagShort(n.tag||'未分類'))}</span><h2 id="news-modal-title">${pageEsc(n.title||'未命名公告')}</h2><div class="meta">${pageEsc(n.date||'')}</div><div class="news-body">${pageEsc(n.body||'').replace(/\n/g,'<br>')}</div></article></div>`;
  pageDetail.querySelectorAll('[data-close-news]').forEach(el=>el.addEventListener('click',()=>pageCloseDetail(true)));
  history.pushState({},'',`${location.pathname}?id=${index}`);
}

pageButtons.forEach(b=>b.addEventListener('click',()=>pageRenderList(b.dataset.category,1)));
pageList.addEventListener('click',e=>{const row=e.target.closest('.news-title-row');if(row)pageShowDetail(Number(row.dataset.index));});
function pageOpenFromUrl(){const params=new URLSearchParams(location.search);let id=params.get('id');if(id===null&&location.hash.startsWith('#n-'))id=location.hash.slice(3);if(id!==null&&pageNewsData[Number(id)])pageShowDetail(Number(id));else pageRenderList('全部');}
window.addEventListener('popstate',pageOpenFromUrl);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pageDetail.hidden)pageCloseDetail(true);});
pageLoadNews().then(loaded=>{
  pageNewsData=loaded.map((item,index)=>({item,index})).sort((a,b)=>{const dt=pageDateValue(b.item)-pageDateValue(a.item);if(dt)return dt;const cb=Number(b.item?.createdAt)||0,ca=Number(a.item?.createdAt)||0;if(cb!==ca)return cb-ca;return a.index-b.index;}).map(x=>x.item);
  pageOpenFromUrl();
});
})();
</script>
<style>
.news-wrap{padding-top:10px}
.news-filter{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.news-filter-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;font:inherit;transition:.2s}
.news-filter-btn:hover,.news-filter-btn.active{color:#fff;border-color:#4ecbff;background:#123047}
.news-title-list{display:grid;gap:10px}
.news-title-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:16px;text-align:left;padding:20px 22px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;cursor:pointer;font:inherit;transition:.2s}
.news-title-row:hover{transform:translateY(-1px);border-color:#4ecbff;background:#12253a}
.news-title-text{font-size:18px;font-weight:700;min-width:0}
.news-title-row time{font-size:13px;color:var(--muted2);white-space:nowrap}
.news-arrow{font-size:20px;color:#66d8ff}
.news-empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.news-pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.news-page-btn{min-width:40px;height:40px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;cursor:pointer;font:inherit;transition:.2s}
.news-page-btn:hover:not(:disabled),.news-page-btn.active{color:#fff;border-color:#4ecbff;background:#123047}
.news-page-btn:disabled{opacity:.4;cursor:not-allowed}
.news-detail{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.news-detail[hidden]{display:none}
.news-modal-backdrop{position:absolute;inset:0;background:rgba(2,10,20,.72);backdrop-filter:blur(4px)}
.news-modal-dialog{position:relative;z-index:1;width:min(860px,100%);max-height:min(78vh,760px);overflow:auto;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.news-detail-card{position:relative;margin:0;padding:34px 38px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.news-detail-card h2{font-size:clamp(28px,4vw,42px);margin:12px 48px 8px 0}
.news-detail-card .meta{color:var(--muted2);font-size:13px;margin-bottom:28px}
.news-body{color:var(--muted);font-size:17px;line-height:2;white-space:normal}
.news-modal-close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;cursor:pointer;font-size:28px;line-height:1;font-family:inherit}
.news-modal-close:hover{border-color:#4ecbff;color:#66d8ff}
.news-modal-open{overflow:hidden}
@media(max-width:700px){.news-title-row{grid-template-columns:auto 1fr auto}.news-title-row time{grid-column:2}.news-arrow{grid-column:3;grid-row:1/3}.news-title-text{font-size:16px}.news-detail{padding:12px}.news-modal-dialog{max-height:88vh}.news-detail-card{padding:26px 22px}.news-detail-card h2{font-size:28px;margin-right:38px}.news-body{font-size:16px;line-height:1.9}}

/* 只新增公告分類顏色；其餘公告列表、日期排序、詳細頁邏輯保持原版不變。 */
.news-title-row .tag,.news-detail-card .tag{border:1px solid transparent}
.news-title-row .tag.category-important,.news-detail-card .tag.category-important{color:#ff8f9a;background:rgba(220,65,82,.16);border-color:rgba(255,115,130,.30)}
.news-title-row .tag.category-maintenance,.news-detail-card .tag.category-maintenance{color:#ffb65c;background:rgba(230,135,35,.16);border-color:rgba(255,180,85,.30)}
.news-title-row .tag.category-update,.news-detail-card .tag.category-update{color:#65c9ff;background:rgba(45,145,220,.16);border-color:rgba(75,175,240,.30)}
.news-title-row .tag.category-event,.news-detail-card .tag.category-event{color:#72d69a;background:rgba(48,170,100,.16);border-color:rgba(85,200,130,.30)}
.news-title-row .tag.category-code,.news-detail-card .tag.category-code{color:#c9a5ff;background:rgba(125,75,210,.17);border-color:rgba(170,125,245,.30)}
.news-title-row .tag.category-punishment,.news-detail-card .tag.category-punishment{color:#ff79c6;background:rgba(220,65,145,.16);border-color:rgba(245,100,175,.30)}
.news-title-row .tag.category-default,.news-detail-card .tag.category-default{color:#9cc4d8;background:rgba(95,145,170,.14);border-color:rgba(120,175,200,.28)}
:root[data-theme="light"] .news-title-row .tag.category-important,:root[data-theme="light"] .news-detail-card .tag.category-important{color:#a9273a;background:#ffe9ed;border-color:#f3a9b5}
:root[data-theme="light"] .news-title-row .tag.category-maintenance,:root[data-theme="light"] .news-detail-card .tag.category-maintenance{color:#a85a00;background:#fff0db;border-color:#efc27c}
:root[data-theme="light"] .news-title-row .tag.category-update,:root[data-theme="light"] .news-detail-card .tag.category-update{color:#075f91;background:#e5f4ff;border-color:#a9d7f2}
:root[data-theme="light"] .news-title-row .tag.category-event,:root[data-theme="light"] .news-detail-card .tag.category-event{color:#187345;background:#e6f8ee;border-color:#a7dfbf}
:root[data-theme="light"] .news-title-row .tag.category-code,:root[data-theme="light"] .news-detail-card .tag.category-code{color:#6840a8;background:#f1e9ff;border-color:#cbb4ee}
:root[data-theme="light"] .news-title-row .tag.category-punishment,:root[data-theme="light"] .news-detail-card .tag.category-punishment{color:#a52c70;background:#ffe8f4;border-color:#efafd0}
:root[data-theme="light"] .news-title-row .tag.category-default,:root[data-theme="light"] .news-detail-card .tag.category-default{color:#35657a;background:#e9f5fa;border-color:#b7d8e4}
</style>
</body></html>
