.dd-event-detail-page{max-width:1040px;padding-top:36px;}

.dd-event-carousel .event-slide{object-fit:cover;cursor:zoom-in;background:#0b1017;}
.dd-event-head{padding:28px 34px 26px;border-bottom:1px solid var(--line);}

.dd-event-summary{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word;}
.dd-event-body{padding:30px 34px 34px;color:var(--muted);font-size:16px;line-height:1.95;overflow-wrap:anywhere;word-break:break-word;}
.dd-event-body br+br{display:block;content:"";margin-top:8px;}
.dd-event-actions{padding:0 34px 34px;}
.dd-event-actions:empty{display:none;}
.dd-event-back{margin-bottom:42px;}
@media(max-width:800px){
  .dd-event-detail-page{padding-top:24px;}
  .dd-event-detail{border-radius:18px;}

  .dd-event-head h1{font-size:30px;}
  .dd-event-body{padding:24px 20px 28px;font-size:15px;line-height:1.9;}
  .dd-event-actions{padding:0 20px 26px;}
}

</footer><script src="app.js"></script><script>(async function(){const q=new URLSearchParams(location.search),id=q.get('id');const API_BASE=window.location.hostname.endsWith('github.io')?'https://duoduo-website.onrender.com':'';let e=null;try{const res=await fetch(`${API_BASE}/api/events`,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();const events=Array.isArray(data.events)?data.events.map(row=>row?.data||row).filter(x=>x&&x.published!==false):[];e=events.find(x=>String(x.id||x.name)===String(id))||null;}catch(error){console.warn('雲端活動詳細資料讀取失敗。',error)}if(!e){document.getElementById('detailName').textContent='找不到活動';document.getElementById('detailSummary').textContent='這筆活動目前不存在或已下架。';const detailCard=document.querySelector('.dd-event-detail');if(detailCard)detailCard.style.display='none';const backButton=document.querySelector('main.content-wrap > .btn.btn-outline');if(backButton)backButton.style.display='none';return;}document.title=`${e.name}｜DuoDuo Valley`;document.getElementById('detailTitle').textContent=e.name;document.getElementById('detailSummary').textContent=e.desc||'';document.getElementById('detailName').textContent=e.name;document.getElementById('detailCarousel').innerHTML=eventCarouselHTML(e,'dd-detail-carousel');document.getElementById('detailDate').textContent=formatEventDateRange(e);document.getElementById('detailBody').innerHTML=esc(e.detail||e.desc||'').replace(/\n/g,'<br>');if(e.url)document.getElementById('detailActions').innerHTML=`<a class="btn btn-gold" href="${esc(e.url)}" target="_blank">前往活動連結 →</a>`;initEventCarousels(document.getElementById('detailCarousel'));const dc=document.getElementById('detailCarousel');if(dc){dc.addEventListener('click',ev=>{const img=ev.target.closest('.event-slide');if(!img)return;const src=img.currentSrc||img.src;if(!src)return;const layer=document.createElement('div');layer.className='event-image-lightbox';layer.innerHTML=`<button type="button" class="event-image-lightbox-close" aria-label="關閉">×</button><img src="${esc(src)}" alt="">`;document.body.appendChild(layer);requestAnimationFrame(()=>layer.classList.add('show'));const close=()=>{layer.classList.remove('show');setTimeout(()=>layer.remove(),180)};layer.addEventListener('click',ev=>{if(ev.target===layer||ev.target.closest('.event-image-lightbox-close'))close()});document.addEventListener('keydown',function onKey(ev){if(ev.key==='Escape'){close();document.removeEventListener('keydown',onKey)}})});}})();</script></body></html>
