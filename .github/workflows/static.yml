# Deploy the public static website and embed one monotonic release revision.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed revision
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path('多多谷官網')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          sha = os.environ['GITHUB_SHA']
          watcher = root / 'dd-site-update.js'
          src = watcher.read_text(encoding='utf-8')
          assert '__DD_BUILD_RUN__' in src and '__DD_BUILD_SHA__' in src, 'Deployment watcher placeholder missing'
          src = src.replace('__DD_BUILD_RUN__', str(run)).replace('__DD_BUILD_SHA__', sha)
          watcher.write_text(src, encoding='utf-8')
          (root / 'dd-release.json').write_text(json.dumps({'run': run, 'sha': sha})+'\n', encoding='utf-8')
          (root / 'dd-release.txt').write_text(sha+'\n', encoding='utf-8')
          print(f'Deploying DuoDuo release {run} ({sha[:12]})')
          PYCODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './多多谷官網'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
