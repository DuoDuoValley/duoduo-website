# Deploy the public static website and embed one monotonic release revision.
# Fresh deployment run after GitHub Pages artifact indexing failure (2026-11-08).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed revision
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path('多多谷官網')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          sha = os.environ['GITHUB_SHA']
          watcher = root / 'dd-site-update.js'
          src = watcher.read_text(encoding='utf-8')
          assert '__DD_BUILD_RUN__' in src and '__DD_BUILD_SHA__' in src, 'Deployment watcher placeholder missing'
          src = src.replace('__DD_BUILD_RUN__', str(run)).replace('__DD_BUILD_SHA__', sha)
          watcher.write_text(src, encoding='utf-8')
          (root / 'dd-release.json').write_text(json.dumps({'run': run, 'sha': sha})+'\n', encoding='utf-8')
          (root / 'dd-release.txt').write_text(sha+'\n', encoding='utf-8')
          print(f'Deploying DuoDuo release {run} ({sha[:12]})')
          PYCODE
      # Build a public-only copy. Keep the source tree intact so Render can
      # still deploy the backend and the admin UI retains all static assets.
      - name: Validate and stage public site
        shell: bash
        run: |
          set -euo pipefail
          node --check "多多谷官網/server.js"
          node --check "多多谷官網/dd-traffic-server.js"
          node --check "多多谷官網/dd-site-update.js"
          node --check "多多谷官網/admin.js"
          SITE_DIST="${RUNNER_TEMP}/duoduo-site-public"
          mkdir -p "${SITE_DIST}"
          cp -a "多多谷官網/." "${SITE_DIST}/"
          # Backend-only sources must not be retrievable via GitHub Pages.
          rm -f -- "${SITE_DIST}/server.js" "${SITE_DIST}/dd-traffic-server.js" "${SITE_DIST}/package.json" "${SITE_DIST}/start.bat"
          # Stop the release if a sensitive local file was accidentally staged.
          if find "${SITE_DIST}" -type f \( \
              -name '.env' -o -name '.env.*' -o \
              -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' -o \
              -iname '*.sql' -o -iname '*.sqlite' -o -iname '*.db' -o -iname '*.bak' -o \
              -iname '*credentials*.json' -o -iname '*service-account*.json' \
            \) -print -quit | grep -q .; then
            echo "Potential private file in public artifact; deployment stopped."
            exit 1
          fi
          for public_file in index.html home.html admin.html admin.js boss.html boss-guides.html dd-site-update.js dd-release.json dd-release.txt; do
            test -s "${SITE_DIST}/${public_file}" || { echo "Required website file missing: ${public_file}"; exit 1; }
          done
          for private_file in server.js dd-traffic-server.js package.json start.bat; do
            test ! -e "${SITE_DIST}/${private_file}" || { echo "Backend source leaked into artifact: ${private_file}"; exit 1; }
          done
          echo "Public artifact validated; backend source excluded (GitHub repository visibility is unchanged)."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/duoduo-site-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
